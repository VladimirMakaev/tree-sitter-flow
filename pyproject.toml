[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "vmakaev@gmail.com", name = "Vladimir Makaev" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Flow grammar for tree-sitter"
keywords = [ "incremental", "parsing", "tree-sitter", "flow" ]
license.text = "MIT"
name = "tree-sitter-flow"
readme = "README.md"
requires-python = ">=3.10"
version = "0.2.0"

[project.urls]
Homepage = "https://github.com/VladimirMakaev/tree-sitter-flow"

[project.optional-dependencies]
core = [ "tree-sitter~=0.27" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
