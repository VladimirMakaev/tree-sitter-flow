[package]
authors = [ "Vladimir Makaev <vmakaev@gmail.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Flow grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "flow" ]
license = "MIT"
name = "tree-sitter-flow"
readme = "README.md"
repository = "https://github.com/VladimirMakaev/tree-sitter-flow"
homepage = "https://github.com/VladimirMakaev/tree-sitter-flow#readme"
version = "0.2.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/src/parser.c",
  "/src/scanner.c",
  "/src/tree_sitter/*",
  "/src/grammar.json",
  "/src/node-types.json",
  "/queries/*",
  "/LICENSE",
  "/README.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
