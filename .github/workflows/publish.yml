name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  crates:
    name: crates.io
    # tree-sitter/workflows at a pinned commit.
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@dca539e07998ac429e185349d3dd194d2c7418d3
    with:
      package-name: tree-sitter-flow
      # Publish the committed parser, which CI checks is up to date.
      generate: false
      abi-version: 15
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
